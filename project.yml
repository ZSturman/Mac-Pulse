name: MacPulse
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MacPulse:
    type: application
    platform: macOS
    sources:
      - MacPulse/App
      - MacPulse/Core
      - MacPulse/Assets.xcassets
    info:
      path: MacPulse/App/Info.plist
      properties:
        CFBundleDisplayName: Mac Pulse
        CFBundleName: Mac Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.local.MacPulse
            CFBundleURLSchemes: [macpulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.MacPulse
        PRODUCT_NAME: Mac Pulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: MacPulseWidget
        embed: true
  MacPulseWidget:
    type: app-extension
    platform: macOS
    sources:
      - MacPulse/Widget
      - MacPulse/Core
    info:
      path: MacPulse/Widget/Info.plist
      properties:
        CFBundleDisplayName: Mac Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MacPulse/Widget/MacPulseWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.MacPulse.Widget
        PRODUCT_NAME: MacPulseWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
schemes:
  MacPulse:
    build:
      targets:
        MacPulse: all
    run:
      config: Debug
